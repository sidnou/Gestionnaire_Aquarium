{% extends 'base.html' %}

{% block content %}
<h1>{{ titre }}</h1>

<table>
    <caption>Liste des aquariums</caption>
    <thead>
        <tr>
            <th>Nom</th>
            <th>Volume d'eau</th>
            <th>Date de mise en service</th>
            <th>Commentaire</th>
        </tr>
    </thead>
    <tbody>
        {% for aquarium in liste_aquariums %}
        <tr>
            <td>{{aquarium.nom}}</td>
            <td> {{aquarium.volume_eau}}</td>
            <td>{{aquarium.date_mise_en_service}}</td>
            <td>{{aquarium.commentaire}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>



{% endblock %}

{% load tailwind_tags %}
<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    {% tailwind_css %}
    <title>{{ titre }}</title>
</head>

<body class="flex flex-col min-h-screen bg-indigo-900 text-white">
<div class="flex flex-row min-h-screen bottom-0 top-0 fixed">
{# Barre #}
    <div class="bg-cyan-700">
        <div class="m-4">
            <div class="text-2xl font-bold mb-4">Gestionnaire Aquariums</div>
            {% include 'aquariums/menus.html' %}
            <div class="mt-auto p-4 bg-cyan-700/50 rounded-xl">
                <small class="text-xs italic">version {{ version }}</small>
            </div>
        </div>
    </div>
    <div class="m-4">
        {% block content %} {% endblock %}
    </div>
</div>
{# Pied de page #}

<div class="bg-indigo-500 text-white p-2">
    <footer class="container mx-auto text-center">

    </footer>
</div>
</body>

</html>
